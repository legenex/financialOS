# Isolated, disposable PostgreSQL for automated tests ONLY.
# Synthetic data, tmpfs storage, loopback-only port. Never used by production.
name: financialos-test
services:
  testdb:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: fos_test
      POSTGRES_PASSWORD: fos_test_only_not_a_secret # privacy-check: allow-generic
      POSTGRES_DB: financialos_test
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off", "-c", "max_connections=200", "-c", "shared_buffers=64MB"]
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data:size=1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fos_test -d financialos_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 768m
    cpus: 2
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    networks: [testnet]
networks:
  testnet: {}
